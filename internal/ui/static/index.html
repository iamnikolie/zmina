<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zmina</title>
<link rel="icon" id="favicon" href="assets/mark.svg">
<link rel="stylesheet" href="app.css">
<script src="patch.js" defer></script>
<script src="app.js" defer></script>
</head>
<body class="sk">
<header class="top">
  <div class="brand"><b>zmina</b><span id="brand-s"></span></div>
  <p class="ev" id="ev"></p>
  <div class="say" id="say" aria-live="polite"><i class="ph" style="width:min(560px,80%)"></i></div>
  <div class="tools">
    <button type="button" class="talk" id="talk-open" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>Talk</span></button>
    <span class="mark" id="mark" aria-hidden="true"></span>
    <nav class="chips" id="chips" aria-label="Crew"></nav>
    <div class="clock" id="clock"><i></i><span></span></div>
  </div>
</header>

<div class="chipmenu" id="chipmenu" role="menu" hidden></div>

<main class="page">
  <div class="col">
    <p class="quiet" id="quiet" hidden></p>
    <section id="hold" aria-labelledby="hold-h">
      <h2 class="lab" id="hold-h"><i class="ph" style="width:120px"></i></h2>
      <div class="rows" id="hold-rows"><div class="row ph-row"><i class="ph"></i></div></div>
    </section>
    <section id="ask" aria-labelledby="ask-h">
      <h2 class="lab" id="ask-h"><i class="ph" style="width:100px"></i></h2>
      <div class="rows" id="ask-rows"><div class="row ph-row"><i class="ph"></i></div><div class="row ph-row"><i class="ph"></i></div></div>
      <div class="hands" id="hands" hidden></div>
    </section>
  </div>
  <div class="col">
    <section id="alarms" aria-labelledby="alarms-h">
      <h2 class="lab" id="alarms-h"></h2>
      <div class="rows" id="alarms-rows"></div>
    </section>
    <section id="others" aria-labelledby="others-h" hidden>
      <h2 class="lab" id="others-h"></h2>
      <div class="rows" id="others-rows"></div>
    </section>
    <section id="go" aria-labelledby="go-h">
      <h2 class="lab" id="go-h"><i class="ph" style="width:80px"></i></h2>
      <div class="rows" id="go-rows"><div class="row ph-row"><i class="ph"></i></div></div>
    </section>
    <section id="later" aria-labelledby="later-h" hidden>
      <h2 class="lab" id="later-h"></h2>
      <div class="rows" id="later-rows"></div>
    </section>
  </div>
  <footer class="foot" id="foot"></footer>
</main>

<!-- from 1400 px, the cockpit (D-03): the readout strip and three zones that scroll on their own -->
<div class="strip" id="strip"></div>
<main class="deck" id="deck">
  <div class="dcol move">
    <div class="dh"><span class="dl" id="move-h"></span></div>
    <div class="rows" id="move-rows"></div>
    <div class="dsub" id="move-ask-h"></div>
    <div class="rows" id="move-asks"></div>
    <div class="dsub al-h" id="move-al-h"></div>
    <div class="rows" id="move-alarms"></div>
  </div>
  <div class="dcol mid">
    <div class="crews" id="crew-col"></div>
    <section class="kb" aria-labelledby="kb-h">
      <div class="dh"><span class="dl" id="kb-h"></span></div>
      <div class="kb-cols" id="kb-cols"></div>
    </section>
  </div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="full" id="full" hidden></div>
<section class="side-panel" id="side" aria-labelledby="side-role side-who" hidden>
  <div class="panel-h">
    <button type="button" class="back" id="side-back" aria-label="Back">‹</button>
    <span class="lamp" id="side-lamp" aria-hidden="true"></span>
    <span class="pick"><button type="button" id="side-pick" aria-haspopup="listbox" aria-expanded="false" aria-label="Other role"><span id="side-role"></span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg></button>
      <span class="pickmenu" id="side-menu" hidden><input id="side-filter" type="search" placeholder="Find a role…" aria-label="Find a role"><span id="side-roles" role="listbox"></span></span></span>
    <h2 class="who" id="side-who"></h2>
    <div class="tools2"><a id="side-term" target="_blank" rel="noreferrer" aria-label="Terminal" title="Terminal"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 9l3 3-3 3M12.5 15H17"/></svg></a><a id="side-full" target="_blank" rel="noreferrer" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></a><button type="button" id="side-close" aria-label="Close" title="Close · Esc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  </div>
  <iframe id="side-frame" title="Conversation" allow="clipboard-write"></iframe>
  <div class="side-list" id="side-list" hidden></div>
</section>
<aside class="drawer" id="history" aria-labelledby="history-h" hidden>
  <div class="drawer-h"><h2 id="history-h"></h2><button type="button" class="q" id="history-close" aria-label="Close">✕</button></div>
  <div class="feed" id="feed"></div>
</aside>
</body>
</html>
