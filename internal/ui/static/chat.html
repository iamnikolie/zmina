<!doctype html>
<html lang="en" class="chat-document">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<title>Chat · zmina</title>
<link rel="icon" href="assets/mark.svg">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="terminals.css">
<link rel="stylesheet" href="chat.css">
<script src="vendor/marked.js" defer></script>
<script src="vendor/purify.js" defer></script>
<script src="chat-content.js" defer></script>
<script src="chat-ids.js" defer></script>
<script src="chat-files.js" defer></script>
<script src="chat-store.js" defer></script>
<script src="chat.js" defer></script>
</head>
<body class="term-page chat-page">
<header class="term-head">
<a href="/">zmina</a>
<details id="session-settings" open>
<summary><span id="session-title">Choose a role</span><span class="term-menu-label">Session</span></summary>
<div class="term-settings">
<label>Node<select id="node" name="node"></select></label>
<label>Role<select id="target" name="target"><option value="">Choose a node</option></select></label>
<div class="term-actions"><button id="refresh" type="button">Refresh</button><button id="open-chat" type="button" disabled>Open chat</button></div>
<label>Dictation language<select id="speech-language" name="speech-language"><option value="ru-RU">Russian</option><option value="uk-UA">Ukrainian</option><option value="en-US">English</option></select></label>
<span id="runtime-info"></span>
</div>
</details>
<nav class="chat-nav" aria-label="Role view"><a id="terminal-link" href="terminals.html?view=terminal">Terminal</a></nav>
</header>
<p id="chat-error" class="chat-error" role="status" hidden></p>
<main id="conversation" aria-label="Conversation"><div id="messages"></div><p id="chat-working" class="chat-working" hidden><i aria-hidden="true"></i><span></span></p><p id="empty-chat">Choose a role to open its conversation.</p></main>
<div class="chat-state"><span id="agent-state" role="status" aria-live="polite">Choose a role</span><button id="start-role" type="button" hidden>Start role</button><button id="stop-turn" type="button" hidden aria-label="Stop current turn">Stop</button></div>
<form id="composer" class="chat-composer">
<button id="chat-latest" type="button" aria-label="Latest" title="Latest" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
<section id="chat-question" class="chat-question" aria-label="Question" hidden></section><div class="composer-box">
<div id="reply-to" class="reply-to" hidden></div>
<div id="draft-files" class="chat-attachments" aria-live="polite"></div>
<input id="file-input" type="file" multiple hidden>
<div class="composer-field">
<label class="term-sr" for="message">Message to this role</label>
<textarea id="message" name="message" rows="1" maxlength="4096" placeholder="Message this role…"></textarea>
<button id="clear-message" class="ib clear" type="button" disabled hidden aria-label="Clear draft" title="Clear draft"><svg class="clear-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><svg class="undo-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
</div>
<div class="composer-row">
<button id="attach-file" class="ib plus" type="button" aria-label="Attach file" title="Attach file" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<span class="sp"></span>
<button id="dictate" class="ib" type="button" disabled aria-label="Dictate" aria-pressed="false" title="Dictate"><svg class="mic-symbol" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v3"/></svg><svg class="stop-symbol" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
<button id="send-message" class="send" type="submit" disabled aria-label="Send" title="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
</div>
</div>
<p id="composer-status" role="status" aria-live="polite" hidden></p>
</form>
</body>
</html>
