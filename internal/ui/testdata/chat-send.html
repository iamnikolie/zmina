<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Chat send state regression fixtures</title>
<style>iframe { width: 390px; height: 760px; border: 1px solid #888; }</style>
<pre id="result">Checking how a message goes…</pre>
<script>
// The real chat page in a frame whose fetch takes a while to take an attached image and the message: while they go
// up the owner's bubble says so (never «waiting to send» with the network there), and once the role has it no line
// under the field says delivery waits for a connection.
(async () => {
  const results = [];
  const assert = (condition, name) => { if (!condition) throw new Error(name); results.push(name); show(); };
  const show = () => { document.getElementById("result").textContent = "running: " + results.join(" / "); };
  const wait = async (what, test, ms = 4000) => {
    const end = Date.now() + ms;
    while (Date.now() < end) { const value = test(); if (value) return value; await new Promise(r => setTimeout(r, 20)); }
    throw new Error("timed out: " + what);
  };
  const page = await (await fetch("../static/chat.html", {cache: "no-store"})).text();
  const fixture = {sends: [], uploads: [], messages: [], refuse: 1};
  const frame = document.createElement("iframe");
  document.body.append(frame);
  frame.contentWindow.fixture = fixture;
  const stub = `<base href="../static/"><script>
    history.replaceState(null, "", location.pathname + "?crew=send-${Date.now()}&role=dev");
    window.fetch = async (url, options = {}) => {
      const json = (body, status = 200) => new Response(typeof body === "string" ? body : JSON.stringify(body), {status, headers: {"Content-Type": "application/json"}});
      const later = (ms) => new Promise(r => setTimeout(r, ms));
      const path = String(url).split("?")[0];
      if (path === "/api/terminal/nodes" || path === "/api/terminal/targets") return json([]);
      if (path === "/api/chat") return json(fixture.snapshot());
      if (path === "/api/chat/send") { const b = JSON.parse(options.body); await later(600); fixture.sends.push(b); fixture.messages.push({id: "web:" + b.id, role: "user", text: b.text, at: new Date().toISOString(), attachments: [{id: b.files[0], name: "shot.png", size: 3, type: "image/png", width: 600, height: 400}]}); return json(fixture.snapshot()); }
      return json("not in this fixture", 404);
    };
    // The upload goes by XMLHttpRequest (for its progress): 40 % at 300 ms, all at 700 ms, taken at 900 ms.
    window.XMLHttpRequest = class {
      constructor() { this.upload = {}; this.status = 0; }
      open(method, url) { this.url = url; }
      setRequestHeader() {}
      send(body) {
        const b = JSON.parse(body), ev = (loaded) => ({lengthComputable: true, loaded, total: 10});
        // D-21 s5: the first upload is refused, so the tile shows its failure and a tap on it retries.
        if (fixture.refuse) { fixture.refuse--; setTimeout(() => { this.status = 400; this.responseText = "refused by this fixture"; this.onload(); }, 200); return; }
        setTimeout(() => this.upload.onprogress?.(ev(4)), 300);
        setTimeout(() => this.upload.onprogress?.(ev(10)), 700);
        setTimeout(() => { fixture.uploads.push(b.upload.name); this.status = 200; this.responseText = JSON.stringify({uploaded: {id: b.upload.id, name: b.upload.name, size: 3}}); this.onload(); }, 900);
      }
    };
  <\/script>`;
  fixture.snapshot = () => ({presentation_version: 1, attachments_supported: true, retry_window_seconds: 604800, role: "dev", runtime: "claude",
    state: "up", status: "idle", session: "session-1", messages: [{id: "m1", role: "assistant", text: "Send me the screenshot.", at: new Date().toISOString()}, ...fixture.messages], pending: []});
  const doc = frame.contentDocument;
  doc.open(); doc.write(page.replace("<head>", "<head>" + stub)); doc.close();
  const $ = (sel) => frame.contentDocument.querySelector(sel);
  try {
    await wait("the conversation", () => $(".chat-message.assistant"));
    const win = frame.contentWindow, files = new win.DataTransfer();
    // A real 600 × 400 picture: its tile is sized from the size measured at the pick (D-21).
    const canvas = document.createElement("canvas"); canvas.width = 600; canvas.height = 400;
    const ctx = canvas.getContext("2d"); ctx.fillStyle = "#4a7"; ctx.fillRect(0, 0, 600, 400);
    const png = await new Promise((r) => canvas.toBlob(r, "image/png"));
    files.items.add(new win.File([png], "shot.png", {type: "image/png"}));
    $("#file-input").files = files.files;
    $("#file-input").dispatchEvent(new win.Event("change", {bubbles: true}));
    await wait("the file on the draft", () => $('#draft-files [aria-label="Remove shot.png"]'), 10000);
    $("#message").value = "here it is";
    $("#message").dispatchEvent(new win.Event("input", {bubbles: true}));
    await wait("Send to be ready", () => !$("#send-message").disabled);
    // Every state the owner's bubble says, in order, until the role has the message.
    const said = [];
    const bars = [], tiles = new Set(), srcs = new Set(), sizes = new Set();
    let unsized = 0, alt = "";
    const watch = setInterval(() => {
      const t = $(".chat-message.user .message-state")?.textContent || ""; if (t && said[said.length - 1] !== t) said.push(t);
      const tile = $(".chat-message.user .fimg.going"); if (tile) { const p = tile.style.getPropertyValue("--p"); if (bars[bars.length - 1] !== p) bars.push(p); }
      const any = $(".chat-message.user .fimg");
      if (any) {
        tiles.add(any); srcs.add(any.querySelector("img").getAttribute("src"));
        const r = any.getBoundingClientRect(); sizes.add(Math.round(r.width) + "x" + Math.round(r.height)); if (!r.width || !r.height) unsized++;
        alt += any.querySelector("img").alt;
      }
    }, 10);
    $("#send-message").click();
    // The refused upload: the tile shows the retry, and a tap on it sends again.
    const failed = await wait("the failed tile", () => $(".chat-message.user .fimg.failed"), 10000);
    assert(getComputedStyle(failed.querySelector(".fring-retry")).display !== "none", "a failed tile shows the retry arrow");
    assert(/^Retry sending shot\.png$/.test(failed.getAttribute("aria-label")), "and says so: " + failed.getAttribute("aria-label"));
    failed.click();
    await wait("the role to have it", () => fixture.sends.length === 1, 20000);
    await wait("the outbox to let it go", () => !$(".chat-message.user .message-state") || !/Uploading|Sending|waiting/.test($(".chat-message.user .message-state").textContent), 20000);
    clearInterval(watch);
    assert(fixture.uploads.join() === "shot.png", "the image went up once");
    assert(!said.some((t) => /waiting to send/.test(t)), "never «waiting to send» while it goes: " + said.join(" / "));
    assert(said.includes("Uploading shot.png…"), "the bubble says the file goes up: " + said.join(" / "));
    assert(said.includes("Sending…"), "then that the message goes: " + said.join(" / "));
    assert(said.indexOf("Uploading shot.png…") < said.lastIndexOf("Sending…"), "in that order");
    assert(bars.includes("0.4"), "the tile's bar shows the upload's progress: " + bars.join(" / "));
    assert(!$(".chat-message.user .fimg.going"), "the tile is whole once the role has it");
    assert(tiles.size === 1, "one tile from the send to the role's copy, never redrawn: " + tiles.size);
    assert(srcs.size === 1 && [...srcs][0].startsWith("blob:"), "it shows the picked bytes throughout, never swapped for the node's copy: " + [...srcs].join(" "));
    assert(!unsized && sizes.size === 1 && sizes.has("240x160"), "its box is 240 × 160 from the first frame: " + [...sizes].join(" "));
    assert(!alt, "no alt text to flash");
    assert($(".chat-message.user .fimg").classList.contains("ready"), "the picture is in");
    assert(!/bytes/.test($(".chat-message.user").textContent), "no bytes under the message");
    assert(!$("#composer-status").textContent, "no line says delivery waits for a connection: " + $("#composer-status").textContent);
    window.chatSendResults = {passed: true, results};
  } catch (e) {
    window.chatSendResults = {passed: false, results, error: e.message + " | page: " + ($("#chat-error")?.textContent || "") + " | files: " + ($("#draft-files")?.textContent || "") + " | input files: " + ($("#file-input")?.files?.length)};
  }
  document.getElementById("result").textContent = JSON.stringify(window.chatSendResults, null, 2);
})();
</script>
