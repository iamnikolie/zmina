<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Chat: images a role looked at (D-20)</title>
<style>iframe { height: 860px; border: 1px solid #888; vertical-align: top; } .phone { width: 390px; } .desk { width: 1280px; }</style>
<pre id="result">Checking the strips…</pre>
<script>
// The real chat page in a frame whose fetch answers for a role that looked at images in three turns (2, 5 and 14 of
// them) and is looking at more in the turn it works on (D-20): one strip per turn over its reply, «Looked at N
// images», five 56 px tiles closed — the fifth «+N» — all of them open; a tap opens the viewer over the strip only;
// the strip of the turn in work grows in place, its tiles kept, a new one fading in.
(async () => {
  const results = [];
  const show = () => { document.getElementById("result").textContent = "running: " + results.join(" / "); };
  const assert = (condition, name) => { if (!condition) throw new Error(name); results.push(name); show(); };
  const wait = async (what, test, ms = 6000) => {
    const end = Date.now() + ms;
    while (Date.now() < end) { const value = test(); if (value) return value; await new Promise(r => setTimeout(r, 25)); }
    throw new Error("timed out: " + what);
  };
  // Page renders: tall, a heading band and lines, each in its own colour, as a role's screenshots look.
  const shot = async (i, w = 280, h = 360) => {
    const c = Object.assign(document.createElement("canvas"), {width: w, height: h}), g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
    g.fillStyle = `hsl(${(i * 47) % 360} 55% 45%)`; g.fillRect(0, 0, w, 44);
    g.fillStyle = "#c9ced3"; for (let y = 64; y < h - 10; y += 18) g.fillRect(16, y, w - 32 - ((y * 7 + i * 13) % 90), 7);
    return new Promise(r => c.toBlob(r, "image/png"));
  };
  const images = {};
  for (let i = 0; i < 30; i++) images["k" + i] = await shot(i, i % 3 ? 280 : 420, i % 3 ? 360 : 240);
  images.k9 = await shot(9, 1600, 1000); // a real desktop screenshot's size: the viewer fills 92vw × 85vh with it
  const strip = (id, from, n, at) => ({id: "looked:" + id, role: "looked", text: "", at, looked: Array.from({length: n}, (_, j) =>
    ({key: "k" + (from + j), path: "/tmp/claude-1/acme/scratchpad/shot-" + (from + j + 1) + ".png", name: "shot-" + (from + j + 1) + ".png", type: "image/png"}))});
  const t = (m) => new Date(Date.now() - m * 60000).toISOString();
  const base = [
    {id: "u1", role: "user", text: "Check the landing page on the phone.", at: t(50)},
    strip("a", 0, 2, t(49)),
    {id: "a1", role: "assistant", text: "The header wraps at 390 px; fixed it, both widths look right now.", at: t(48)},
    {id: "u2", role: "user", text: "And the pricing table?", at: t(40)},
    strip("b", 2, 5, t(39)),
    {id: "a2", role: "assistant", text: "Pricing reads well at all five widths I tried.", at: t(38)},
    {id: "u3", role: "user", text: "Go through every page once.", at: t(30)},
    strip("c", 7, 14, t(29)),
    {id: "a3", role: "assistant", text: "All fourteen pages render; two had a clipped footer, fixed in the last commit.", at: t(28)},
    {id: "u4", role: "user", text: "Now the checkout.", at: t(5)},
    {id: "a4", role: "assistant", text: "Opening the checkout at three widths.", at: t(4), provisional: true},
  ];

  async function open(cls, crew) {
    const fixture = {thumbs: 0, live: 2};
    const frame = document.createElement("iframe");
    frame.className = cls;
    document.body.append(frame);
    frame.contentWindow.fixture = fixture;
    const page = await (await fetch("../static/chat.html", {cache: "no-store"})).text();
    const stub = `<base href="../static/"><script>
      history.replaceState(null, "", location.pathname + "?crew=${crew}&role=dev");
      window.fetch = async (url, options = {}) => {
        const json = (body, status = 200) => new Response(typeof body === "string" ? body : JSON.stringify(body), {status, headers: {"Content-Type": "application/json"}});
        const [path, query] = String(url).split("?");
        if (path === "/api/terminal/nodes" || path === "/api/terminal/targets") return json([]);
        if (path === "/api/chat") return json(fixture.snapshot());
        if (path === "/api/items") return json({items: {}});
        if (path === "/api/chat/paths") return json({paths: []});
        return json("not in this fixture", 404);
      };
    <\/script>`;
    // The images come as the page asks for them: <img src> goes to the network, so they are served as blob URLs by
    // rewriting the tiles' sources once drawn (the fixture has no server for /api/chat/looked).
    fixture.snapshot = () => ({presentation_version: 1, attachments_supported: true, retry_window_seconds: 604800, role: "dev", runtime: "claude",
      state: "up", status: "busy", active: true, since: t(4), session: "session-1", cursor: "c" + fixture.live,
      messages: [...base, {...strip("d", 21, fixture.live, t(4)), provisional: true}], pending: []});
    const doc = frame.contentDocument;
    doc.open(); doc.write(page.replace("<head>", "<head>" + stub)); doc.close();
    const $ = (sel) => frame.contentDocument.querySelector(sel), $$ = (sel) => [...frame.contentDocument.querySelectorAll(sel)];
    const blobs = {};
    for (const [k, b] of Object.entries(images)) blobs[k] = URL.createObjectURL(b);
    const feed = () => { for (const img of $$(".lk-tile img, .fv-img")) { const k = new URLSearchParams(img.src.split("?")[1] || "").get("key"); if (k && blobs[k]) img.src = blobs[k]; } };
    new frame.contentWindow.MutationObserver(feed).observe(frame.contentDocument, {subtree: true, childList: true, attributes: true, attributeFilter: ["src"]});
    await wait("the strips", () => $$(".chat-message.looked").length === 4);
    feed();
    return {frame, fixture, $, $$};
  }

  try {
    for (const cls of ["phone", "desk"]) {
      const {frame, fixture, $, $$} = await open(cls, "looked-" + cls);
      const strips = $$(".chat-message.looked");
      const words = strips.map(s => s.querySelector(".lk-words").textContent);
      assert(words.join("|") === "Looked at 2 images|Looked at 5 images|Looked at 14 images|Looked at 2 images", cls + ": one strip per turn, its count: " + words.join("|"));
      // Each strip stands over the reply that closes its turn.
      for (const s of strips.slice(0, 3)) assert(s.nextElementSibling.matches(".chat-message.assistant"), cls + ": a strip over its reply");
      const tiles = strips.map(s => s.querySelectorAll(".lk-tile").length);
      assert(tiles.join() === "2,5,5,2", cls + ": five tiles at most, closed: " + tiles.join());
      const fourteen = strips[2], last = fourteen.querySelectorAll(".lk-tile")[4];
      assert(last.querySelector(".fmore")?.textContent === "+10", cls + ": the fifth carries +N (total − 4)");
      assert(!strips[1].querySelector(".fmore"), cls + ": five of five carry no +N");
      const box = last.getBoundingClientRect();
      assert(Math.round(box.width) === 56 && Math.round(box.height) === 56, cls + ": 56 px tiles");
      const label = fourteen.querySelector(".lk-label");
      assert(label.tagName === "BUTTON" && label.getAttribute("aria-expanded") === "false", cls + ": over five the label is a button, closed by default");
      const five = strips[1].querySelector(".lk-label");
      assert(five.tagName === "P" && !five.querySelector(".lk-chev") && five.textContent === "Looked at 5 images", cls + ": up to five it is plain text, no chevron (l5)");
      const tileImg = last.querySelector("img");
      assert(getComputedStyle(tileImg).opacity === "0.75" || tileImg.getAnimations().length > 0, cls + ": tiles rest at .75 (l4)");
      // Spacing: 12 px under the message before, 16 px over the reply.
      const gap = (a, b) => Math.round(b.getBoundingClientRect().top - a.getBoundingClientRect().bottom);
      assert(gap(fourteen.previousElementSibling, fourteen) === 12, cls + ": 12 px under the message before: " + gap(fourteen.previousElementSibling, fourteen));
      assert(gap(fourteen, fourteen.nextElementSibling) === 16, cls + ": 16 px over the reply: " + gap(fourteen, fourteen.nextElementSibling));
      if (cls === "phone") await new Promise(r => setTimeout(r, 300)), fixture.closedShot = true;
      // l2: open, all tiles wrap, the same size.
      label.click();
      assert(label.getAttribute("aria-expanded") === "true" && fourteen.querySelectorAll(".lk-tile").length === 14, cls + ": open shows all 14");
      assert(!fourteen.querySelector(".fmore"), cls + ": no +N open");
      const rows = new Set([...fourteen.querySelectorAll(".lk-tile")].map(x => Math.round(x.getBoundingClientRect().top)));
      assert(cls === "desk" ? rows.size >= 1 : rows.size > 1, cls + ": they wrap where the column ends (" + rows.size + " rows)");
      // v1: a tap opens the viewer over this strip only.
      const third = fourteen.querySelectorAll(".lk-tile")[2];
      third.focus(); third.click();
      await wait("the viewer", () => $(".fview"));
      assert($(".fv-title b").textContent === "shot-10.png" && $(".fv-title span").textContent === "Looked at · 3 of 14", cls + ": name, then «Looked at · 3 of 14»: " + $(".fv-title").textContent);
      assert($(".fv-path").textContent === "/tmp/claude-1/acme/scratchpad/shot-10.png", cls + ": its path with Copy");
      const copy = $(".fv-copy").getBoundingClientRect(), icon = $(".fv-copy svg").getBoundingClientRect();
      assert(Math.round(copy.width) === 44 && Math.round(copy.height) === 44 && Math.round(icon.width) === 15, cls + ": Copy a 15 px icon in a 44 px hit (v2): " + Math.round(copy.width) + "/" + Math.round(icon.width));
      await wait("the image drawn", () => $(".fv-img").naturalWidth === 1600);
      const big = $(".fv-img").getBoundingClientRect(), view = frame.contentWindow;
      const prev = $(".fv-prev")?.getBoundingClientRect(), next = $(".fv-next")?.getBoundingClientRect();
      assert(cls === "phone" ? Math.round(big.width) === view.innerWidth : big.width > 0.85 * view.innerWidth - 144 || big.height > 0.8 * view.innerHeight, cls + ": a 1600 px shot fills the viewer: " + Math.round(big.width) + "×" + Math.round(big.height));
      assert(cls === "phone" || (big.left >= prev.right && big.right <= next.left), cls + ": clear of the arrows (v3)");
      assert(third.getAttribute("aria-label") === "Looked at shot-10.png, 3 of 14", cls + ": the tile's label");
      frame.contentDocument.dispatchEvent(new KeyboardEvent("keydown", {key: "Escape", bubbles: true}));
      assert(!$(".fview") && frame.contentDocument.activeElement === third, cls + ": Esc closes, focus back on the tile");
      label.click();
      assert(fourteen.querySelectorAll(".lk-tile").length === 5, cls + ": closed again");
      // l3: the strip of the turn in work grows in place: its tiles kept, the new one fading in.
      const live = $$(".chat-message.looked")[3], before = [...live.querySelectorAll(".lk-tile")];
      fixture.live = 3;
      await wait("the live strip grows", () => live.querySelectorAll(".lk-tile").length === 3, 8000);
      const after = [...live.querySelectorAll(".lk-tile")];
      assert(after[0] === before[0] && after[1] === before[1], cls + ": its tiles are the same elements");
      assert(after[2].classList.contains("lk-new") && !after[0].classList.contains("lk-new"), cls + ": the new one fades in");
      assert(live.querySelector(".lk-words").textContent === "Looked at 3 images", cls + ": the count follows");
      fixture.live = 7;
      await wait("past five the label turns into the button", () => live.querySelector("button.lk-label .lk-chev"), 8000);
      assert(live.querySelectorAll(".lk-tile").length === 5 && live.querySelector(".fmore").textContent === "+3", cls + ": seven: five tiles, +3");
      assert(after[0] === live.querySelectorAll(".lk-tile")[0], cls + ": the tiles still the same elements");
      live.scrollIntoView({block: "end"});
    }
    window.chatLookedResults = {passed: true, results};
  } catch (e) {
    window.chatLookedResults = {passed: false, results, error: e.message};
  }
  document.getElementById("result").textContent = JSON.stringify(window.chatLookedResults, null, 2);
})();
</script>
